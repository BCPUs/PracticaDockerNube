services:
  mysql:
    image: mysql:8.0
    container_name: mysqlserver2
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "empresa"

    ports:
      - "3350:3306"

  app:
    build: .
    container_name: pythonapp
    ports:
      -"8081:5000"

    depends_on:
      - mysql

